# Localized error titles and message templates.
#
# Keys are derived from the problem type URI by ErrorType.getMessageKey().
# Missing keys fall back to the English values declared on the error type
# enum, so translations can be added incrementally. This file is also the
# reference template for translators: English resolution always uses the
# declarations, never this bundle. PreconditionErrorType and
# PostconditionErrorType are intentionally untranslated and use the fallback.

# Shared record-level labels
error.label.authorization=Authorization
error.label.business-rule=Business rule '%s'
error.label.invariant=Invariant '%s'
error.detail.with-id=%1$s (error ID: %2$s)


# Localized reason phrases used as RFC 7807 about:blank titles (RFC 7231).
# Coverage: the statuses used by the toolkit's error types plus the most
# common 4xx/5xx codes. Other codes fall back to HttpStatus.description().

http.status.207=Multi-Status
http.status.400=Bad Request
http.status.401=Unauthorized
http.status.403=Forbidden
http.status.404=Not Found
http.status.405=Method Not Allowed
http.status.406=Not Acceptable
http.status.408=Request Timeout
http.status.409=Conflict
http.status.412=Precondition Failed
http.status.415=Unsupported Media Type
http.status.422=Unprocessable Content
http.status.423=Locked
http.status.429=Too Many Requests
http.status.500=Internal Server Error
http.status.501=Not Implemented
http.status.502=Bad Gateway
http.status.503=Service Unavailable
http.status.504=Gateway Timeout
